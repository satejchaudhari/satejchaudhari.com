  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="assets/css/style.css">
  <script>
  (function(){
    try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}
    document.addEventListener('DOMContentLoaded',function(){
      var b=document.querySelector('.theme-toggle');
      if(b)b.addEventListener('click',function(){
        var d=document.documentElement,c=d.getAttribute('data-theme')||'dark',n=c==='dark'?'light':'dark';
        d.setAttribute('data-theme',n);try{localStorage.setItem('theme',n);}catch(e){}
      });
      var nt=document.querySelector('.nav-toggle'),nv=document.querySelector('.site-nav');
      if(nt&&nv&&!nt.dataset.bound){nt.dataset.bound='1';nt.addEventListener('click',function(){var o=nv.classList.toggle('open');nt.setAttribute('aria-expanded',o?'true':'false');});}
    });
  })();
  </script>

  <style>
    .search-wrap { max-width: 840px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); }
    .search-top { padding: 28px 0 10px; }
    .search-top .eyebrow { color: var(--accent); }
    .search-top h1 { font-family: "Space Grotesk", sans-serif; font-size: clamp(1.5rem, 3.5vw, 2.1rem); margin: 4px 0 10px; }
    .search-box { position: sticky; top: 0; background: var(--bg); padding: 10px 0 14px; z-index: 5; display: flex; align-items: center; gap: 12px; }
    #search-input { flex: 1 1 auto; font-family: var(--mono); font-size: 1rem; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    #search-input:focus { outline: none; border-color: var(--accent-border); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
    #search-count { font-family: var(--mono); font-size: 0.72rem; color: var(--muted-2); white-space: nowrap; }
    .search-empty { color: var(--muted); font-size: 0.9rem; padding: 18px 0; }

    .search-hit { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 1px solid var(--border); border-radius: 9px; margin-bottom: 7px; text-decoration: none; background: var(--surface); transition: border-color .12s, transform .08s; }
    .search-hit:hover { border-color: var(--accent-border); transform: translateX(2px); }
    .search-type { flex: 0 0 auto; font-family: var(--mono); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted-2); min-width: 66px; text-align: center; }
    .search-type-theory { color: #22d3ee; border-color: color-mix(in srgb,#22d3ee 45%,transparent); }
    .search-type-vuln { color: #fb7185; border-color: color-mix(in srgb,#fb7185 45%,transparent); }
    .search-type-tool { color: #a78bfa; border-color: color-mix(in srgb,#a78bfa 45%,transparent); }
    .search-type-map { color: #3b9ee5; border-color: color-mix(in srgb,#3b9ee5 45%,transparent); }
    .search-type-reference { color: #f59e0b; border-color: color-mix(in srgb,#f59e0b 45%,transparent); }
    .search-type-writeup { color: #4ade80; border-color: color-mix(in srgb,#4ade80 45%,transparent); }
    .search-type-technique { color: #fb7185; border-color: color-mix(in srgb,#fb7185 45%,transparent); }
    .search-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .search-title { color: var(--text); font-weight: 600; font-size: 0.92rem; }
    .search-sub { color: var(--muted); font-size: 0.78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-tag { flex: 0 0 auto; font-family: var(--mono); font-size: 0.62rem; color: var(--muted-2); }
    @media (max-width: 600px) { .search-sub { white-space: normal; } .search-tag { display: none; } }
  </style>
</head>
